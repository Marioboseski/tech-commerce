# Nginx inside the production client image: serves the React build and
# forwards API and image requests to the server container.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Nginx allows only 1 MB by default. Kept above the server's 5 MB image
    # limit, so the server answers with its own clear message.
    client_max_body_size 10m;

    location /api/ {
        proxy_pass http://server:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /images/ {
        proxy_pass http://server:5000;
        proxy_set_header Host $host;
    }

    # Vite puts a hash in these file names, so they can be cached for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # React Router: every other path (/orders/5, /admin...) gets index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
